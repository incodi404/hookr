services:
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: redis-server --requirepass ${REDIS_PASSWD}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    container_name: raabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq

  hookr-db:
    container_name: hookr-db
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${PGSQL_DB}
      POSTGRES_USER: ${PGSQL_USERNAME}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD}
    volumes:
      - hookr_db_data:/var/lib/postgresql/data

  hookr-api:
    container_name: hookr-api
    build:
      context: . # access the root
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - 7000:7000
    env_file:
      - ./.env
    depends_on:
      - redis
      - rabbitmq
      - hookr-db
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules

  hookr-websocket:
    container_name: hookr-websocket
    build:
      context: . # access the root
      dockerfile: apps/websocket/Dockerfile
      target: dev
    ports:
      - 8000:8000
    env_file:
      - ./.env
    depends_on:
      - redis
      - rabbitmq
      - hookr-db
    volumes:
      - ./apps/websocket:/app/apps/websocket
      - ./packages:/app/packages
      - /app/node_modules

  delivery-worker:
    container_name: delivery-worker
    build:
      context: . # access the root
      dockerfile: apps/workers/delivery-worker/Dockerfile
      target: dev
    env_file:
      - ./.env
    depends_on:
      - redis
      - rabbitmq
      - hookr-db
    volumes:
      - ./apps/workers/delivery-worker:/app/apps/workers/delivery-worker
      - ./packages:/app/packages
      - /app/node_modules

  email-worker:
    container_name: email-worker
    build:
      context: . # access the root
      dockerfile: apps/workers/email-worker/Dockerfile
      target: dev
    env_file:
      - ./.env
    depends_on:
      - redis
      - rabbitmq
      - hookr-db
    volumes:
      - ./apps/workers/email-worker:/app/apps/workers/email-worker
      - ./packages:/app/packages
      - /app/node_modules

  schedule-worker:
    container_name: schedule-worker
    build:
      context: . # access the root
      dockerfile: apps/workers/schedule-worker/Dockerfile
      target: dev
    env_file:
      - ./.env
    depends_on:
      - redis
      - rabbitmq
      - hookr-db
    volumes:
      - ./apps/workers/schedule-worker:/app/apps/workers/schedule-worker
      - ./packages:/app/packages
      - /app/node_modules

volumes:
  redis_data:
  rabbitmq_data:
  rabbitmq_log:
  hookr_db_data:
